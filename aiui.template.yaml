# Generated by praisonaiui.mkdocs_import from mkdocs.yml.
# The MkDocs file is left unchanged. aiui build reads this file.
# Dropped: pymdownx.snippets includes are not expanded; the include lines stay in the page.
# Dropped: ignored YAML tag !!python/name:pymdownx.superfences.fence_code_format
schemaVersion: 1
site:
  title: PraisonAI WordPress Plugin
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: AI Chatbot for WordPress - Easy Integration Guide
seo:
  siteUrl: https://wp.praison.ai
navigation:
  tabs:
  - tab: Home
    groups:
    - group: Home
      pages:
      - index
  - tab: Getting Started
    groups:
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/configuration
      prefix: getting-started
  - tab: Features
    groups:
    - group: Features
      pages:
      - features/chatbot
      - features/shortcode
      - features/api-settings
      prefix: features
  - tab: Guides
    groups:
    - group: Guides
      pages:
      - guides/customization
      - guides/troubleshooting
      prefix: guides
navbar:
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/PraisonAIWP-Plugin
footer:
  socials:
    github: https://github.com/MervinPraison/PraisonAIWP-Plugin
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: PraisonAI WordPress Plugin
  footer_main:
    type: Footer
    props:
      text: PraisonAI WordPress Plugin
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
